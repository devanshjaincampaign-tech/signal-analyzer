services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sih
      POSTGRES_PASSWORD: sih_dev_pw
      POSTGRES_DB: signal_analyzer
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
volumes:
  pgdata: